<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="960" height="260" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1 screenshot -->
    <rect x="58" y="62" width="64" height="48" rx="6"/>
    <path d="M58 74 H122"/>
    <!-- 2 read -->
    <path d="M296 70 v-8 h8 M336 62 h8 v8 M344 102 v8 h-8 M304 110 h-8 v-8"/>
    <path d="M308 80 h24 M308 88 h24 M308 96 h16"/>
    <!-- 3 score -->
    <path d="M538 110 V90 M554 110 V76 M570 110 V64 M586 110 V84"/>
    <!-- 4 folder -->
    <path d="M778 72 a4 4 0 0 1 4 -4 h16 l6 6 h26 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-48 a4 4 0 0 1 -4 -4 z"/>
    <path d="M794 92 l7 7 l13 -14"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M168 86 H258"/>
    <path d="M392 86 H492"/>
    <path d="M628 86 H730"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="90" y="158" font-size="18" font-weight="700">Screenshot</text>
    <text x="90" y="184" font-size="14" fill-opacity="0.85">lands in your folder</text>
    <text x="320" y="158" font-size="18" font-weight="700">Read on-device</text>
    <text x="320" y="184" font-size="14" fill-opacity="0.85">text, app name, image labels</text>
    <text x="562" y="158" font-size="18" font-weight="700">Score every rule</text>
    <text x="562" y="184" font-size="14" fill-opacity="0.85">keywords, projects, merchants</text>
    <text x="562" y="206" font-size="14" fill-opacity="0.85">and what you filed before</text>
    <text x="806" y="158" font-size="18" font-weight="700">Filed</text>
    <text x="806" y="184" font-size="14" fill-opacity="0.85">or General, for Triage</text>
  </g>
</svg>
