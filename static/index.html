<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shotshelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='5' width='26' height='20' rx='6' fill='url(%23g)'/%3E%3Crect x='8' y='10' width='16' height='10' rx='2.5' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0a0b10;
  --bg-2: #11131b;
  --panel: rgba(22, 24, 34, 0.72);
  --panel-solid: #161822;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #eceef6;
  --muted: #8b90a5;
  --faint: #5b6075;
  --accent: #7c6cff;
  --accent-2: #22d3ee;
  --accent-soft: rgba(124, 108, 255, 0.16);
  --danger: #ff5d7a;
  --ok: #34d399;
  --card: #151722;
  --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
  --radius: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-in: cubic-bezier(.4, 0, 1, 1);
  --size: 240px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5fa;
    --bg-2: #ffffff;
    --panel: rgba(255, 255, 255, 0.75);
    --panel-solid: #ffffff;
    --line: rgba(20, 22, 40, 0.08);
    --line-strong: rgba(20, 22, 40, 0.16);
    --text: #161827;
    --muted: #61667d;
    --faint: #9aa0b5;
    --accent-soft: rgba(124, 108, 255, 0.12);
    --card: #e9ebf3;
    --shadow: 0 20px 50px -24px rgba(30, 30, 60, 0.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
svg { display: block; flex-shrink: 0; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 15px; height: 15px; }

/* aurora backdrop */
.aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; opacity: .55; filter: blur(60px); }
.aurora i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 26s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 46vw; height: 46vw; left: 8%; top: -6%; background: radial-gradient(circle, rgba(124,108,255,.35), transparent 65%); }
.aurora i:nth-child(2) { width: 40vw; height: 40vw; right: 2%; top: 18%; background: radial-gradient(circle, rgba(34,211,238,.22), transparent 65%); animation-duration: 32s; animation-delay: -8s; }
.aurora i:nth-child(3) { width: 36vw; height: 36vw; left: 38%; bottom: -10%; background: radial-gradient(circle, rgba(236,72,153,.16), transparent 65%); animation-duration: 38s; animation-delay: -14s; }
@media (prefers-color-scheme: light) { .aurora { opacity: .5; } .aurora i { mix-blend-mode: normal; } }
@keyframes drift { to { transform: translate(6vw, 5vh) scale(1.12); } }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 272px 1fr; height: 100%; }

/* sidebar */
.side {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 14px; }
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 20px -6px rgba(124,108,255,.8); }
.logo svg { width: 18px; height: 18px; stroke: #fff; }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: -1px; }
.search { margin: 4px 14px 10px; position: relative; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 11px;
  background: rgba(127,127,160,.08); border: 1px solid var(--line); outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.search input:focus { border-color: rgba(124,108,255,.55); box-shadow: 0 0 0 4px var(--accent-soft); background: rgba(127,127,160,.12); }
.search .icon { position: absolute; left: 11px; top: 10px; color: var(--muted); }
.search kbd { position: absolute; right: 9px; top: 9px; }
kbd {
  font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: rgba(127,127,160,.08);
}
.nav { flex: 1; overflow-y: auto; padding: 4px 10px 16px; scrollbar-width: thin; }
.nav h6 { margin: 16px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.item {
  position: relative; display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 9px; color: var(--muted); text-align: left; transition: background .15s, color .15s, transform .15s;
}
.item:hover { background: rgba(127,127,160,.09); color: var(--text); }
.item.active { background: var(--accent-soft); color: var(--text); }
.item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(var(--accent), var(--accent-2)); }
.item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.item .badge { font-size: 11px; font-weight: 600; color: #fff; padding: 1px 7px; border-radius: 99px; background: linear-gradient(135deg, var(--accent), #a855f7); }
.item .chev { width: 14px; height: 14px; color: var(--faint); transition: transform .2s var(--ease); margin-left: -4px; }
.item .chev.open { transform: rotate(90deg); }
.item .chev.none { visibility: hidden; }
.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.item.drop { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--accent); transform: scale(1.02); }
.children { overflow: hidden; }
.side-foot { padding: 12px 14px 16px; border-top: 1px solid var(--line); }
.ghost-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 36px; border-radius: 10px;
  border: 1px dashed var(--line-strong); color: var(--muted); transition: all .2s;
}
.ghost-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top {
  display: flex; align-items: center; gap: 14px; padding: 18px 28px 14px;
  border-bottom: 1px solid transparent; transition: border-color .2s, background .2s;
}
.top.scrolled { border-color: var(--line); background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.crumbs { flex: 1; min-width: 0; }
.crumbs .path { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; min-height: 18px; }
.crumbs .path button:hover { color: var(--text); }
.crumbs h1 { margin: 2px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 10px; }
.crumbs h1 #count { font-size: 14px; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.tools { display: flex; align-items: center; gap: 6px; }
.tbtn {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px;
  color: var(--muted); border: 1px solid var(--line); background: rgba(127,127,160,.05);
  transition: color .15s, background .15s, border-color .15s, transform .15s;
}
.tbtn:hover { color: var(--text); background: rgba(127,127,160,.12); border-color: var(--line-strong); }
.tbtn:active { transform: scale(.96); }
.tbtn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent), #9f7aea); box-shadow: 0 8px 24px -10px rgba(124,108,255,.9); }
.tbtn.primary:hover { filter: brightness(1.08); }
.tbtn.icon-only { width: 36px; padding: 0; justify-content: center; }
.range { display: flex; align-items: center; gap: 8px; color: var(--faint); padding: 0 6px; }
.range input { width: 90px; accent-color: var(--accent); }

.scroller { flex: 1; overflow-y: auto; padding: 6px 28px 120px; scroll-behavior: smooth; }
.group-h {
  position: sticky; top: 0; z-index: 2; margin: 18px -28px 10px; padding: 8px 28px;
  font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .01em;
  background: linear-gradient(var(--bg) 60%, transparent);
}
.group-h em { font-style: normal; color: var(--faint); font-weight: 500; margin-left: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size), 1fr)); gap: 16px; }
.card {
  position: relative; margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--card);
  aspect-ratio: 16 / 10; cursor: pointer; isolation: isolate;
  box-shadow: 0 0 0 1px var(--line); content-visibility: auto; contain-intrinsic-size: 240px 150px;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), opacity .25s;
  animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 18ms);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; opacity: 0; transition: opacity .4s, transform .5s var(--ease); }
.card img.loaded { opacity: 1; }
.card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(5,6,12,.78)); opacity: 0; transition: opacity .25s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px var(--line-strong), var(--shadow); }
.card:hover img { transform: scale(1.035); }
.card:hover::after, .card.sel::after { opacity: 1; }
.card .meta { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; color: #fff; opacity: 0; transform: translateY(6px); transition: all .25s var(--ease); }
.card:hover .meta { opacity: 1; transform: none; }
.card .meta b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta span { font-size: 11.5px; opacity: .75; }
.card .chip { display: inline-block; margin-top: 4px; font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.16); backdrop-filter: blur(6px); }
.check {
  position: absolute; top: 10px; left: 10px; z-index: 2; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.85); background: rgba(10,10,20,.25);
  opacity: 0; transform: scale(.8); transition: all .2s var(--ease);
}
.check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.4; opacity: 0; }
.card:hover .check, .selecting .check { opacity: 1; transform: none; }
.card.sel { box-shadow: 0 0 0 2.5px var(--accent), 0 14px 40px -14px rgba(124,108,255,.7); transform: scale(.97); }
.card.sel .check { opacity: 1; transform: none; background: var(--accent); border-color: var(--accent); }
.card.sel .check svg { opacity: 1; }
.card.leaving { animation: leave .32s var(--ease-in) forwards; pointer-events: none; }
@keyframes leave { to { opacity: 0; transform: scale(.6) translateY(20px); filter: blur(4px); } }
.card.dragging { opacity: .35; }
.sentinel { height: 1px; }

.empty { display: grid; place-items: center; text-align: center; padding: 12vh 20px; color: var(--muted); animation: rise .5s var(--ease) both; }
.empty .art { width: 120px; height: 120px; margin-bottom: 18px; border-radius: 32px; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 20%, var(--accent-soft), transparent 70%), rgba(127,127,160,.06); border: 1px solid var(--line); }
.empty .art svg { width: 48px; height: 48px; color: var(--accent); stroke-width: 1.2; }
.empty h3 { margin: 0 0 6px; color: var(--text); font-size: 17px; }
.empty p { margin: 0; max-width: 360px; }

/* selection bar */
.selbar {
  position: fixed; left: calc(50% + 136px); bottom: 26px; z-index: 20; display: flex; align-items: center; gap: 6px;
  padding: 7px 7px 7px 16px; border-radius: 16px; background: var(--panel-solid); border: 1px solid var(--line-strong);
  box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); transform: translate(-50%, 140%); opacity: 0;
  transition: transform .35s var(--ease), opacity .25s;
}
.selbar.show { transform: translate(-50%, 0); opacity: 1; }
.selbar .n { font-weight: 600; margin-right: 8px; font-variant-numeric: tabular-nums; }
.selbar .tbtn { height: 34px; }
.selbar .danger:hover { color: var(--danger); border-color: rgba(255,93,122,.4); background: rgba(255,93,122,.1); }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 40; display: none; }
.overlay.open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(4,5,10,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }

/* lightbox */
.lb-stage { position: absolute; inset: 64px 80px 92px; display: grid; place-items: center; }
.lb-stage img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.9); transform-origin: top left; user-select: none; -webkit-user-drag: none; }
.lb-top { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; color: #fff; animation: fade .3s .1s both; }
.lb-top .title { flex: 1; min-width: 0; }
.lb-top .title b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-top .title span { font-size: 12px; color: rgba(255,255,255,.6); }
.lb .tbtn { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.06); }
.lb .tbtn:hover { color: #fff; background: rgba(255,255,255,.14); }
.lb .tbtn.on { color: #fff; background: rgba(124,108,255,.45); border-color: transparent; }
.lb-nav { position: absolute; top: 50%; width: 48px; height: 48px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center;
  color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); transition: all .2s; }
.lb-nav:hover { background: rgba(255,255,255,.18); transform: scale(1.06); }
.lb-nav.prev { left: 18px; } .lb-nav.next { right: 18px; }
.lb-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; display: flex; align-items: center; justify-content: center; gap: 8px; animation: fade .3s .1s both; }
.film { display: flex; gap: 6px; max-width: 70vw; overflow: hidden; padding: 4px; }
.film img { width: 74px; height: 46px; object-fit: cover; object-position: top; border-radius: 7px; opacity: .45; cursor: pointer; transition: all .2s; flex-shrink: 0; }
.film img:hover { opacity: .8; }
.film img.cur { opacity: 1; box-shadow: 0 0 0 2px var(--accent); transform: translateY(-3px); }
.progress { position: absolute; left: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; }
.textpane {
  position: absolute; top: 64px; right: 0; bottom: 92px; width: 360px; padding: 18px; overflow-y: auto; color: #e8eaf3;
  background: rgba(16,18,28,.92); border-left: 1px solid rgba(255,255,255,.08); border-radius: 14px 0 0 14px;
  transform: translateX(100%); transition: transform .35s var(--ease); white-space: pre-wrap; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.textpane.open { transform: none; }
.lb.text-open .lb-stage { right: 380px; }
.lb.text-open .lb-nav.next { right: 378px; }
.menu-btn { display: none; }
.side-scrim { display: none; }

/* palette */
.pal {
  position: absolute; left: 50%; top: 14vh; width: min(560px, 92vw); transform: translateX(-50%);
  background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 18px; overflow: hidden;
  box-shadow: 0 40px 100px -30px rgba(0,0,0,.8); animation: pop .28s var(--ease) both;
}
@keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(.97); } }
.pal-head { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.pal-head input { flex: 1; height: 56px; border: 0; outline: none; background: none; font-size: 16px; }
.pal-head .icon { color: var(--muted); }
.pal-sub { padding: 10px 18px 0; font-size: 12px; color: var(--faint); }
.pal-list { max-height: 50vh; overflow-y: auto; padding: 8px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--muted); text-align: left; }
.opt .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.opt .name mark { background: none; color: var(--accent); font-weight: 600; }
.opt.hi { background: var(--accent-soft); }
.opt .hint { font-size: 12px; color: var(--faint); }

/* triage */
.tri { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 22px 30px 26px; color: #fff; }
.tri-head { width: 100%; display: flex; align-items: center; gap: 14px; animation: fade .3s both; }
.tri-head h2 { margin: 0; font-size: 18px; flex: 1; }
.tri-head h2 span { color: rgba(255,255,255,.55); font-weight: 500; font-size: 14px; margin-left: 8px; }
.tri-bar { width: 100%; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); margin: 14px 0 0; overflow: hidden; }
.tri-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s var(--ease); }
.tri-stage { position: relative; flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; margin: 18px 0; perspective: 1400px; }
.tri-card { position: absolute; max-width: min(1100px, 92%); max-height: 100%; border-radius: 14px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.9); transition: transform .45s var(--ease), opacity .4s; }
.tri-card.back { transform: translateY(18px) scale(.94); opacity: .35; filter: blur(1px); }
.tri-card.fly { transition: transform .45s var(--ease-in), opacity .4s var(--ease-in); opacity: 0; }
.tri-hint { margin-bottom: 12px; font-size: 12.5px; color: rgba(255,255,255,.55); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.tri-hint kbd { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.06); }
.targets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1100px; }
.target {
  display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 14px 0 8px; border-radius: 12px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.88);
  transition: all .2s var(--ease); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 30ms);
}
.target:hover { background: rgba(124,108,255,.28); border-color: rgba(124,108,255,.6); transform: translateY(-2px); }
.target.hit { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.target kbd { color: #fff; border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.1); min-width: 22px; text-align: center; }
.done-art { text-align: center; animation: pop2 .5s var(--ease) both; }
@keyframes pop2 { from { opacity: 0; transform: scale(.9); } }
.done-art .ring { width: 88px; height: 88px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 20px 60px -10px rgba(124,108,255,.8); }
.done-art .ring svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 2; }

/* toast */
.toasts { position: fixed; right: 22px; bottom: 22px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 16px; border-radius: 13px; max-width: 420px;
  background: var(--panel-solid); border: 1px solid var(--line-strong); box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  animation: tin .35s var(--ease) both;
}
.toast.out { animation: tout .25s var(--ease-in) forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes tout { to { opacity: 0; transform: translateX(30px); } }
.toast .ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(52,211,153,.16); color: var(--ok); }
.toast .ok svg { width: 13px; height: 13px; stroke-width: 2.2; }
.toast span { flex: 1; }
.toast button { font-weight: 600; color: var(--accent); padding: 4px 8px; border-radius: 7px; }
.toast button:hover { background: var(--accent-soft); }

.drag-ghost { position: fixed; top: -200px; left: -200px; padding: 8px 12px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 284px; z-index: 30; transform: translateX(-105%); transition: transform .3s var(--ease); background: var(--panel-solid); }
  .side.open { transform: none; box-shadow: 30px 0 80px -20px rgba(0,0,0,.6); }
  .side-scrim.open { display: block; position: fixed; inset: 0; z-index: 29; background: rgba(4,5,10,.5); animation: fade .2s both; }
  .menu-btn { display: inline-flex; }
  .crumbs h1 { font-size: 20px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(min(var(--size), 46%), 1fr)); gap: 10px; }
  .selbar { left: 50%; }
  .top, .scroller { padding-left: 16px; padding-right: 16px; }
  .range, .tbtn .lbl { display: none; }
  .lb-stage { inset: 64px 12px 92px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .aurora { display: none; }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15l4.5-4.5a1.5 1.5 0 012 0L14 15m-1.5-1.5l1.5-1.5a1.5 1.5 0 012 0L21 16"/><circle cx="16" cy="9" r="1.3"/></symbol>

  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-2.5-1.6L13 20.5l-2.5-1.6L8 20.5l-2-1.3z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></symbol>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg class="icon"><use href="#i-logo"/></svg></div>
      <div><b>Shotshelf</b><small id="total">Loading...</small></div>
    </div>
    <label class="search">
      <svg class="icon sm"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search text in screenshots" autocomplete="off" aria-label="Search screenshots">
      <kbd>/</kbd>
    </label>
    <nav class="nav" id="nav" aria-label="Folders"></nav>
    <div class="side-foot">
      <button class="ghost-btn" id="newFolder"><svg class="icon sm"><use href="#i-plus"/></svg>New folder</button>
    </div>
  </aside>

  <div class="side-scrim" id="sideScrim"></div>
  <main class="main">
    <header class="top" id="top">
      <button class="tbtn icon-only menu-btn" id="menuBtn" aria-label="Folders"><svg class="icon sm"><use href="#i-folder"/></svg></button>
      <div class="crumbs">
        <div class="path" id="path"></div>
        <h1><span id="title-text"></span><span id="count"></span></h1>
      </div>
      <div class="tools">
        <button class="tbtn primary" id="triageBtn" hidden><svg class="icon sm"><use href="#i-cards"/></svg><span class="lbl">Triage</span></button>
        <button class="tbtn" id="shuffleBtn" title="Shuffle (S)"><svg class="icon sm"><use href="#i-shuffle"/></svg><span class="lbl">Shuffle</span></button>
        <button class="tbtn" id="playBtn" title="Slideshow (P)"><svg class="icon sm"><use href="#i-play"/></svg><span class="lbl">Slideshow</span></button>
        <button class="tbtn icon-only" id="sortBtn" title="Newest / oldest first"><svg class="icon sm"><use href="#i-sort"/></svg></button>
        <label class="range" title="Thumbnail size"><svg class="icon sm"><use href="#i-grid"/></svg><input id="size" type="range" min="150" max="420" step="10" aria-label="Thumbnail size"></label>
      </div>
    </header>
    <section class="scroller" id="scroller"><div id="content"></div></section>
  </main>
</div>

<div class="selbar" id="selbar" role="toolbar" aria-label="Selection">
  <span class="n" id="selN"></span>
  <button class="tbtn" data-act="move"><svg class="icon sm"><use href="#i-move"/></svg>Move <kbd>M</kbd></button>
  <button class="tbtn" data-act="resort" title="Run the auto-sorter again"><svg class="icon sm"><use href="#i-wand"/></svg>Auto-sort</button>
  <button class="tbtn" data-act="reveal" title="Show in Finder"><svg class="icon sm"><use href="#i-eye"/></svg></button>
  <button class="tbtn danger" data-act="trash" title="Move to Trash"><svg class="icon sm"><use href="#i-trash"/></svg></button>
  <button class="tbtn icon-only" data-act="clear" title="Clear selection (Esc)"><svg class="icon sm"><use href="#i-x"/></svg></button>
</div>

<div class="overlay lb" id="lb">
  <div class="scrim"></div>
  <div class="progress" id="lbProg"></div>
  <div class="lb-top">
    <div class="title"><b id="lbName"></b><span id="lbInfo"></span></div>
    <button class="tbtn" id="lbPlay" title="Slideshow (P)"><svg class="icon sm"><use href="#i-play"/></svg></button>
    <button class="tbtn" id="lbShuffle" title="Shuffle (S)"><svg class="icon sm"><use href="#i-shuffle"/></svg></button>
    <button class="tbtn" id="lbText" title="Show text (T)"><svg class="icon sm"><use href="#i-text"/></svg></button>
    <button class="tbtn" id="lbMove" title="Move (M)"><svg class="icon sm"><use href="#i-move"/></svg>Move</button>
    <button class="tbtn" id="lbReveal" title="Show in Finder"><svg class="icon sm"><use href="#i-eye"/></svg></button>
    <button class="tbtn" id="lbTrash" title="Trash (Delete)"><svg class="icon sm"><use href="#i-trash"/></svg></button>

  <button class="lb-nav next" id="lbNext" aria-label="Next"><svg class="icon"><use href="#i-chev"/></svg></button>

<div class="overlay" id="pal">

  <div class="pal" role="dialog" aria-label="Move to folder">
    <div class="pal-head"><svg class="icon"><use href="#i-move"/></svg><input id="palQ" placeholder="Move to folder... (type a new path to create it)" autocomplete="off"></div>
    <div class="pal-sub" id="palSub"></div>

      <button class="tbtn" id="triSkip" style="color:#fff" title="Skip (Space)"><svg class="icon sm"><use href="#i-skip"/></svg>Skip</button>

    <div class="tri-hint"><span><kbd>1</kbd>-<kbd>9</kbd> send</span><span><kbd>/</kbd> any folder</span><span><kbd>Space</kbd> skip</span><span><kbd>Z</kbd> undo</span><span><kbd>Esc</kbd> done</span></div>
    <div class="targets" id="targets"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (id, cls = "icon sm") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
  const store = {
    get(k, d) { try { const v = localStorage.getItem("shotshelf." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("shotshelf." + k, JSON.stringify(v)); } catch {} },
  };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const ICONS = {
    receipts: "receipt", development: "code", general: "inbox", "ai chats": "spark", "chats & messages": "chat",
    finance: "chart", documents: "doc", social: "heart", travel: "plane", "maps & places": "pin", "design & inspiration": "palette",
  };
  const iconFor = p => ICONS[p.split("/")[0].toLowerCase()] || "folder";
  const hue = s => { let x = 0; for (const c of s.split("/")[0]) x = (x * 31 + c.charCodeAt(0)) % 360; return x; };
  const dotColor = p => `hsl(${hue(p)} 80% 64%)`;

  const api = {
    get: url => fetch(url).then(r => r.json()),
    post: (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Shotshelf": "1" }, body: JSON.stringify(body) })
      .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || "Request failed"); return j; }),
  };
  const thumb = p => "/thumb?p=" + encodeURIComponent(p);
  const full = p => "/file?p=" + encodeURIComponent(p);
  const baseName = p => p.split("/").pop();
  const folderOf = p => p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "";
  const prettyName = n => n.replace(/\.(png|jpe?g|heic|gif|webp|tiff|bmp)$/i, "");

  const S = {
    folders: [], fallback: "General", inbox: 0, root: "",
    view: store.get("view", { kind: "folder", folder: "General" }),
    items: [], shuffled: false, newestFirst: true,
    sel: new Set(), anchor: null, rendered: 0,
    open: store.get("open", {}),
    recent: store.get("recent", []),
  };

  // ------------------------------------------------------------- folders
  async function loadFolders() {
    const d = await api.get("/api/folders");
    S.folders = d.folders; S.fallback = d.fallback; S.inbox = d.inbox; S.root = d.root;
    const total = d.folders.reduce((a, f) => a + f.count, 0) + d.inbox;
    $("#total").textContent = total.toLocaleString() + " screenshots";
    renderNav();
  }

  function tree() {
    const root = { children: new Map(), count: 0, total: 0, path: "" };
    for (const f of S.folders) {
      let node = root;
      f.path.split("/").forEach((part, i, arr) => {
        const path = arr.slice(0, i + 1).join("/");
        if (!node.children.has(part)) node.children.set(part, { name: part, path, children: new Map(), count: 0, total: 0 });
        node = node.children.get(part);
      });
      node.count = f.count;
    }
    const sum = n => { n.total = n.count; for (const c of n.children.values()) n.total += sum(c); return n.total; };
    sum(root);
    return root;
  }

  function navItem({ label, ic, count, badge, active, onClick, path, depth = 0, hasKids, open, color }) {
    const b = h("button", "item" + (active ? " active" : ""));
    b.style.paddingLeft = 10 + depth * 14 + "px";
    b.innerHTML =
      (depth || hasKids != null ? `<svg class="icon chev ${hasKids ? (open ? "open" : "") : "none"}"><use href="#i-chev"/></svg>` : "") +
      (color ? `<span class="dot" style="background:${color}"></span>` : icon(ic)) +
      `<span class="name">${esc(label)}</span>` +
      (badge ? `<span class="badge">${badge}</span>` : count != null ? `<span class="count">${count.toLocaleString()}</span>` : "");
    b.onclick = e => {
      if (hasKids && e.target.closest(".chev")) { S.open[path] = !open; store.set("open", S.open); renderNav(); return; }
      onClick();
    };
    if (path != null) makeDrop(b, path);
    return b;
  }

  function renderNav() {
    const nav = $("#nav"); nav.innerHTML = "";
    const v = S.view;
    nav.append(h("h6", null, "Library"));
    nav.append(navItem({ label: "All screenshots", ic: "grid", active: v.kind === "all", onClick: () => go({ kind: "all" }) }));
    const t = tree();
    const fb = t.children.get(S.fallback);
    nav.append(navItem({
      label: S.fallback, ic: "inbox", badge: fb && fb.total ? fb.total : null, path: S.fallback,
      active: v.kind === "folder" && v.folder === S.fallback, onClick: () => go({ kind: "folder", folder: S.fallback }),
    }));
    if (S.inbox) nav.append(navItem({ label: "Waiting to sort", ic: "tray", count: S.inbox, path: "", active: v.kind === "folder" && v.folder === "", onClick: () => go({ kind: "folder", folder: "" }) }));
    nav.append(h("h6", null, "Folders"));
    const walk = (node, depth) => {
      const kids = [...node.children.values()].filter(c => !(depth === 0 && c.name === S.fallback))
        .sort((a, b) => depth === 0 ? b.total - a.total : a.name.localeCompare(b.name));
      for (const c of kids) {
        const hasKids = c.children.size > 0, open = !!S.open[c.path];
        nav.append(navItem({
          label: c.name, ic: iconFor(c.path), count: c.total, path: c.path, depth, hasKids, open,
          color: depth ? dotColor(c.path) : null,
          active: v.kind === "folder" && v.folder === c.path, onClick: () => go({ kind: "folder", folder: c.path }),
        }));
        if (hasKids && open) walk(c, depth + 1);
      }
    };
    walk(t, 0);
  }

  // ------------------------------------------------------------- views
  const viewHash = v => v.kind === "all" ? "#/all" : v.kind === "search" ? "#/search/" + encodeURIComponent(v.q) : "#/f/" + v.folder.split("/").map(encodeURIComponent).join("/");
  function hashView() {
    const m = location.hash.match(/^#\/(all|search|f)\/?(.*)$/);
    if (!m) return null;
    if (m[1] === "all") return { kind: "all" };
    if (m[1] === "search") return { kind: "search", q: decodeURIComponent(m[2]) };
    return { kind: "folder", folder: m[2].split("/").map(decodeURIComponent).join("/") };
  }
  window.addEventListener("hashchange", () => { const v = hashView(); if (v && viewHash(v) !== viewHash(S.view)) go(v); });

  async function go(view, keepScroll) {
    S.view = view; store.set("view", view);
    if (location.hash !== viewHash(view)) history.replaceState(null, "", viewHash(view));
    S.sel.clear(); S.shuffled = false;
    renderNav(); updateSel();
    let url;
    if (view.kind === "search") url = "/api/shots?q=" + encodeURIComponent(view.q);
    else if (view.kind === "all") url = "/api/shots?deep=1";
    else url = "/api/shots?deep=1&folder=" + encodeURIComponent(view.folder);
    const items = await api.get(url);
    if (S.view !== view) return;
    S.items = items;
    if (!S.newestFirst) S.items.reverse();
    renderHeader();
    renderGrid(keepScroll);
  }

  function renderHeader() {
    const v = S.view, path = $("#path");
    path.innerHTML = "";
    let title;
    if (v.kind === "all") title = "All screenshots";
    else if (v.kind === "search") title = `"${v.q}"`;
    else if (v.folder === "") title = "Waiting to sort";
    else {
      const parts = v.folder.split("/");
      title = parts.pop();
      parts.forEach((p, i) => {
        const b = h("button", null, esc(p));
        const fp = parts.slice(0, i + 1).join("/");
        b.onclick = () => go({ kind: "folder", folder: fp });
        path.append(b, h("span", null, icon("chev", "icon sm")));
      });
    }

  // ------------------------------------------------------------- keyboard
  document.addEventListener("keydown", e => {
    const typing = e.target.matches("input, textarea");
    if ($("#pal").classList.contains("open")) return;
    if ($("#tri").classList.contains("open")) {
      if (e.key === "Escape") closeTri();
      else if (/^[1-9]$/.test(e.key) && triTargets[+e.key - 1]) triSend(triTargets[+e.key - 1], $("#targets").children[+e.key - 1]);
      else if (e.key === "/") { e.preventDefault(); triPick(); }
      else if (e.key === " ") { e.preventDefault(); $("#triSkip").click(); }
      else if (e.key.toLowerCase() === "z") triUndo();
      return;
    }
    if ($("#lb").classList.contains("open")) {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowRight") step(1);
      else if (e.key === "ArrowLeft") step(-1);
      else if (e.key === " " || e.key.toLowerCase() === "p") { e.preventDefault(); lbTimer ? stopShow() : startShow(); }
      else if (e.key.toLowerCase() === "s") lbShuffle();
      else if (e.key.toLowerCase() === "t") $("#lbText").click();
      else if (e.key.toLowerCase() === "m") $("#lbMove").click();
      else if (e.key === "Backspace" || e.key === "Delete") $("#lbTrash").click();
      return;
    }
    if (typing) { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
    else if (e.key === "Escape" && S.sel.size) { S.sel.clear(); syncSel(); }
    else if ((e.metaKey || e.ctrlKey) && e.key === "a") { e.preventDefault(); S.items.forEach(it => S.sel.add(it.p)); syncSel(); }
    else if (e.key.toLowerCase() === "m" && S.sel.size) openPal([...S.sel]);
    else if ((e.key === "Backspace" || e.key === "Delete") && S.sel.size) trash([...S.sel]);
    else if (e.key.toLowerCase() === "s") $("#shuffleBtn").click();
    else if (e.key.toLowerCase() === "p") $("#playBtn").click();
    else if (e.key.toLowerCase() === "t" && !$("#triageBtn").hidden) openTri();
  });

  // ------------------------------------------------------------- boot
  (async () => {
    await loadFolders();
    const v = hashView() || S.view;
    const exists = v.kind !== "folder" || v.folder === S.fallback || v.folder === "" || S.folders.some(f => f.path === v.folder);
    go(exists ? v : { kind: "folder", folder: S.fallback });
    setInterval(async () => {
      const before = S.folders.reduce((a, f) => a + f.count, 0) + S.inbox;
      await loadFolders();
      const after = S.folders.reduce((a, f) => a + f.count, 0) + S.inbox;
      if (after !== before && !S.sel.size && !$("#lb").classList.contains("open") && !$("#tri").classList.contains("open")) go(S.view, true);
    }, 8000);
  })();
})();
</script>
</body>
</html>
